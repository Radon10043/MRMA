    cpus: "0.5"
    profiles:
      - "hybrid"
    command: >
      bash -c "
        python3 -u -m src.experiment --email radon@xs.ustb.edu.cn RQ6 --group hybrid --temperature 1.0 --top_p 1.0 --linear > cand_temp_1.0_top_1.0.log 2>&1
      "

  hybrid_temp_1.5_top_0.5:
