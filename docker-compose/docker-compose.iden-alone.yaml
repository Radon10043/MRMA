x-mr-base: &mr-base
  image: mr-cot-rag:latest
  working_dir: /vol/MR-CoT-RAG # <- Put your working directory here
  environment:
    - http_proxy= # <- Maybe you want to enable proxies
    - https_proxy=
    - EMAIL="" # <- Set your email here for notification
  volumes:
    - vol-mr-cot-rag:/vol # <- It is recommended to use volumes for persistent storage
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro

volumes:
  vol-mr-cot-rag:
    external: true

services:
  gemini-2.5-pro:
    <<: *mr-base
    cpus: "0.5"
    command: >
      bash -c "
        python3 -u -m src.experiment --email $$EMAIL iden_alone --model gemini-2.5-pro > single_gemini-2.5-pro.log 2>&1
      "

  gemini-2.5-flash:
